<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-labelledby="title desc">
  <title id="title">Keywi chromatic rainbow divider</title>
  <desc id="desc">A rounded horizontal rainbow gradient bar.</desc>
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1493"/>
      <stop offset="0.16" stop-color="#ff3b30"/>
      <stop offset="0.32" stop-color="#ff9500"/>
      <stop offset="0.48" stop-color="#ffe600"/>
      <stop offset="0.64" stop-color="#00f5a0"/>
      <stop offset="0.80" stop-color="#00bfff"/>
