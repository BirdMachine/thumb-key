name: One-off richer suggestion engine

on:
  push:
    branches:
      - birdie/gradient-backgrounds

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: birdie/gradient-backgrounds
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate offline English frequency list
        run: |
          python -m pip install --quiet wordfreq==3.1.1
          mkdir -p app/src/main/assets
          python - <<'PY'
          from pathlib import Path
          from wordfreq import top_n_list
          words = []
          seen = set()
          for word in top_n_list('en', 30000):
              w = word.strip()
              low = w.lower()
              if len(w) < 2 or low in seen:
                  continue
              if not any(ch.isalpha() for ch in w):
                  continue
              seen.add(low)
              words.append(w)
              if len(words) >= 25000:
                  break
          Path('app/src/main/assets/keywi_en_frequency.txt').write_text('\n'.join(words) + '\n', encoding='utf-8')
          Path('app/src/main/assets/KEYWI_WORDLIST_NOTICE.txt').write_text(
              'Keywi English frequency word list\n\n'
              'Generated from the English frequency data distributed with wordfreq 3.1.1.\n'
              'wordfreq: https://github.com/rspeer/wordfreq\n'
              'wordfreq software is Apache-2.0; redistributed data includes material under\n'
              'Creative Commons Attribution-ShareAlike 4.0 (CC BY-SA 4.0).\n'
              'See the upstream wordfreq LICENSE and README for source-specific attribution.\n',
              encoding='utf-8'
          )
          print(f'Generated {len(words)} ranked words')
          PY
      - name: Add merged personal and offline suggestion engine
        run: |
          cat > app/src/main/java/com/dessalines/thumbkey/ui/components/keyboard/KeywiSuggestionEngine.kt <<'KOTLIN'
          package com.dessalines.thumbkey.ui.components.keyboard

          import android.content.Context
          import android.provider.UserDictionary
          import java.util.Locale

          private const val PERSONAL_PREFS = "keywi_personal_dictionary"
          private const val PERSONAL_WORDS = "words"
          private const val ENGLISH_ASSET = "keywi_en_frequency.txt"

          object KeywiPersonalDictionary {
              fun add(
                  context: Context,
                  word: String,
              ) {
                  val clean = word.trim()
                  if (clean.isEmpty()) return
                  val prefs = context.getSharedPreferences(PERSONAL_PREFS, Context.MODE_PRIVATE)
                  val next = prefs.getStringSet(PERSONAL_WORDS, emptySet()).orEmpty().toMutableSet()
                  next.removeAll { it.equals(clean, ignoreCase = true) }
                  next.add(clean)
                  prefs.edit().putStringSet(PERSONAL_WORDS, next).apply()
              }

              fun words(context: Context): List<String> =
                  context
                      .getSharedPreferences(PERSONAL_PREFS, Context.MODE_PRIVATE)
                      .getStringSet(PERSONAL_WORDS, emptySet())
                      .orEmpty()
                      .toList()
          }

          object KeywiSuggestionEngine {
              private var bundledWords: List<String>? = null
              private var androidWords: List<Pair<String, Int>> = emptyList()
              private var androidWordsLoadedAt = 0L

              private fun loadBundled(context: Context): List<String> {
                  bundledWords?.let { return it }
                  return runCatching {
                      context.assets.open(ENGLISH_ASSET).bufferedReader().useLines { lines ->
                          lines.map(String::trim).filter(String::isNotEmpty).toList()
                      }
                  }.getOrDefault(emptyList()).also { bundledWords = it }
              }

              private fun loadAndroidWords(context: Context): List<Pair<String, Int>> {
                  val now = System.currentTimeMillis()
                  if (now - androidWordsLoadedAt < 5_000L) return androidWords
                  androidWordsLoadedAt = now
                  androidWords =
                      runCatching {
                          val result = mutableListOf<Pair<String, Int>>()
                          context.contentResolver
                              .query(
                                  UserDictionary.Words.CONTENT_URI,
                                  arrayOf(UserDictionary.Words.WORD, UserDictionary.Words.FREQUENCY),
                                  null,
                                  null,
                                  "${UserDictionary.Words.FREQUENCY} DESC",
                              )?.use { cursor ->
                                  val wordColumn = cursor.getColumnIndex(UserDictionary.Words.WORD)
                                  val frequencyColumn = cursor.getColumnIndex(UserDictionary.Words.FREQUENCY)
                                  while (cursor.moveToNext() && result.size < 1000) {
                                      val word = cursor.getString(wordColumn)?.trim().orEmpty()
                                      if (word.isNotEmpty()) {
                                          val frequency = if (frequencyColumn >= 0) cursor.getInt(frequencyColumn) else 0
                                          result += word to frequency
                                      }
                                  }
                              }
                          result
                      }.getOrDefault(emptyList())
                  return androidWords
              }

              fun suggest(
                  context: Context,
                  token: String,
                  alphaPrefix: String,
                  limit: Int = 5,
              ): List<String> {
                  val tokenQuery = token.trim()
                  val alphaQuery = alphaPrefix.trim()
                  if (tokenQuery.length < 2 && alphaQuery.length < 2) return emptyList()

                  val query = if (tokenQuery.any { !it.isLetter() && it != '\'' }) tokenQuery else alphaQuery
                  val normalizedQuery = query.lowercase(Locale.US)
                  val seen = linkedSetOf<String>()
                  val results = mutableListOf<String>()

                  fun add(candidate: String) {
                      if (results.size >= limit) return
                      val clean = candidate.trim()
                      if (clean.isEmpty() || clean.equals(query, ignoreCase = true)) return
                      if (!clean.lowercase(Locale.US).startsWith(normalizedQuery)) return
                      val key = clean.lowercase(Locale.US)
                      if (seen.add(key)) results += clean
                  }

                  KeywiPersonalDictionary.words(context)
                      .sortedBy { it.lowercase(Locale.US) }
                      .forEach(::add)

                  loadAndroidWords(context)
                      .sortedByDescending { it.second }
                      .forEach { (word, _) -> add(word) }

                  if (results.size < limit && alphaQuery.length >= 2 && query == alphaQuery) {
                      val normalizedAlpha = alphaQuery.lowercase(Locale.US)
                      for (word in loadBundled(context)) {
                          if (results.size >= limit) break
                          if (word.lowercase(Locale.US).startsWith(normalizedAlpha)) add(word)
                      }
                  }

                  val preserveCase = alphaQuery.firstOrNull()?.isUpperCase() == true && query == alphaQuery
                  return if (preserveCase) {
                      results.map { word -> word.replaceFirstChar { it.titlecase(Locale.US) } }
                  } else {
                      results
                  }
              }
          }
          KOTLIN

          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/dessalines/thumbkey/ui/components/keyboard/SuggestionBarV2.kt')
          s = p.read_text()
          old = 'suggestions = LocalSuggestionEngineV2.suggest(nextPrefix)'
          new = 'suggestions = KeywiSuggestionEngine.suggest(ime, nextToken, nextPrefix, MAX_VISIBLE_SUGGESTIONS)'
          if old not in s:
              raise SystemExit('Could not find suggestion call to replace')
          s = s.replace(old, new, 1)
          old2 = '''                                        }.onSuccess {\n                                            justAddedWord = word'''
          new2 = '''                                        }.onSuccess {\n                                            KeywiPersonalDictionary.add(ime, word)\n                                            suggestions =\n                                                KeywiSuggestionEngine.suggest(\n                                                    ime,\n                                                    currentToken,\n                                                    prefix,\n                                                    MAX_VISIBLE_SUGGESTIONS,\n                                                )\n                                            justAddedWord = word'''
          if old2 not in s:
              raise SystemExit('Could not find dictionary success block to replace')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Format and validate
        run: |
          ./gradlew formatKotlin
          ./gradlew lintKotlin
          ./gradlew :app:lintDebug
          ./gradlew :app:assembleDebug
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/dessalines/thumbkey/ui/components/keyboard/SuggestionBarV2.kt \
                  app/src/main/java/com/dessalines/thumbkey/ui/components/keyboard/KeywiSuggestionEngine.kt \
                  app/src/main/assets/keywi_en_frequency.txt \
                  app/src/main/assets/KEYWI_WORDLIST_NOTICE.txt
          git commit -m "Add richer offline and personal suggestion engine"
          git push origin HEAD:birdie/gradient-backgrounds
