name: Keywi source patch

on:
  push:
    branches:
      - birdie/gradient-backgrounds
    paths:
      - .github/workflows/keywi-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: birdie/gradient-backgrounds

      - name: Apply Keywi master gate patch
        run: python scripts/apply-keywi-master-gate.py

      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo "Source already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/dessalines/thumbkey/ui/components/keyboard/KeyboardScreen.kt
          git add app/src/main/java/com/dessalines/thumbkey/ui/components/keyboard/KeyboardKey.kt
          git commit -m "Gate shiny key rendering behind Keywi master switch"
          git push origin HEAD:birdie/gradient-backgrounds
