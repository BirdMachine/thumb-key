name: Keywi gradient patch
on:
  push:
    branches: [birdie/gradient-backgrounds]
    paths: [.github/workflows/keywi-gradient-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: birdie/gradient-backgrounds
      - run: python scripts/keywi-gradient-managed-build.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/dessalines/thumbkey/ComposeKeyboardView.kt
          git add app/src/main/java/com/dessalines/thumbkey/ui/components/keyboard/ToolbarThemePreferences.kt
          git add app/src/main/java/com/dessalines/thumbkey/ui/components/settings/lookandfeel/AdvancedLookAndFeelScreen.kt
          git commit -m "Add toolbar hairlines and saved gradient manager"
          git push origin HEAD:birdie/gradient-backgrounds
