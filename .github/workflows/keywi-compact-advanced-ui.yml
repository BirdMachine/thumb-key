name: Keywi compact advanced UI
on:
  push:
    branches: [birdie/gradient-backgrounds]
    paths: [.github/workflows/keywi-compact-advanced-ui.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: birdie/gradient-backgrounds
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: python scripts/keywi-compact-advanced-ui.py
      - run: ./gradlew formatKotlin
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          git commit -m "Compact Advanced Look and Feel UI"
          git push origin HEAD:birdie/gradient-backgrounds
