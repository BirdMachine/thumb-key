name: Android build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "birdie/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Expose backdrop editor and push source-only change
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/dessalines/thumbkey/ui/components/settings/lookandfeel/LookAndFeelScreen.kt')
          text = path.read_text()
          old = '''                    if (backdropEnabledState) {\n                        BackdropSettingsSection(onChanged = { updateLookAndFeel() })\n                    }\n'''
          new = '''                    BackdropSettingsSection(onChanged = { updateLookAndFeel() })\n'''
          if old not in text:
              raise SystemExit('Backdrop visibility guard not found')
          path.write_text(text.replace(old, new, 1))
          PY
          ./gradlew formatKotlin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/dessalines/thumbkey/ui/components/settings/lookandfeel/LookAndFeelScreen.kt
          git commit -m "Always expose backdrop appearance editor"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Check Kotlin formatting
        run: ./gradlew lintKotlin

      - name: Android lint
        run: ./gradlew lint

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: keywi-debug
          path: app/build/outputs/apk/debug/*.apk
