name: Android build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "birdie/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Fix final backdrop formatting lines
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/dessalines/thumbkey/ui/components/keyboard/KeyboardScreen.kt')
          text = path.read_text()
          text = text.replace(
              '    val counterclockwiseDragAction = CircularDragAction.entries[settings?.counterclockwiseDragAction ?: DEFAULT_COUNTERCLOCKWISE_DRAG_ACTION]\n',
              '    val counterclockwiseDragAction =\n        CircularDragAction.entries[\n            settings?.counterclockwiseDragAction ?: DEFAULT_COUNTERCLOCKWISE_DRAG_ACTION\n        ]\n',
          )
          text = text.replace(
              '                                                KeyboardMode.MAIN, KeyboardMode.SHIFTED, KeyboardMode.CTRLED, KeyboardMode.ALTED -> keyboardDefinition.modes.numeric\n',
              '                                                KeyboardMode.MAIN, KeyboardMode.SHIFTED, KeyboardMode.CTRLED, KeyboardMode.ALTED -> {\n                                                    keyboardDefinition.modes.numeric\n                                                }\n',
          )
          path.write_text(text)
          PY
          ./gradlew formatKotlin
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/dessalines/thumbkey/ui/components/keyboard/KeyboardScreen.kt
          git commit -m "Fix final backdrop formatting lines"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Check Kotlin formatting
        run: ./gradlew lintKotlin

      - name: Android lint
        run: ./gradlew lint

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: keywi-debug
          path: app/build/outputs/apk/debug/*.apk
