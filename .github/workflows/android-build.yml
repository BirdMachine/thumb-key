name: Fishwi CI

on:
  push:
    branches:
      - "fishwi"

concurrency:
  group: fishwi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    name: Validate & build Fishwi debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KEYWI_DEBUG_STORE_FILE: ${{ github.workspace }}/.github/keywi-debug.keystore
      KEYWI_DEBUG_STORE_PASSWORD: keywi-debug
      KEYWI_DEBUG_KEY_ALIAS: keywi-debug
      KEYWI_DEBUG_KEY_PASSWORD: keywi-debug

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore stable debug signing key
        run: base64 --decode .github/keywi-debug.keystore.b64 > .github/keywi-debug.keystore

      - name: Set monotonic Fishwi version code
        run: echo "KEYWI_VERSION_CODE=$((300000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Normalize Kotlin formatting
        run: ./gradlew formatKotlin

      - name: Check Kotlin formatting
        run: ./gradlew lintKotlin

      - name: Run Android lint
        run: ./gradlew lint

      - name: Build Fishwi debug APK
        run: ./gradlew assembleDebug

      - name: Upload Fishwi debug APK
        uses: actions/upload-artifact@v6
        with:
          name: fishwi-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
