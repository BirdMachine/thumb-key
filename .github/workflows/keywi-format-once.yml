name: Keywi format once
on:
  push:
    branches: [birdie/gradient-backgrounds]
    paths: [.github/workflows/keywi-format-once.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: birdie/gradient-backgrounds
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew formatKotlin
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          git commit -m "Format gradient manager implementation"
          git push origin HEAD:birdie/gradient-backgrounds
