name: Keywi CI

on:
  push:
    branches:
      - "main"

concurrency:
  group: keywi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    name: Validate & build Keywi debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install stable Keywi debug signing key
        run: |
          mkdir -p "$HOME/.android"
          cp .github/keywi-debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Normalize Kotlin formatting
        run: ./gradlew formatKotlin

      - name: Check Kotlin formatting
        run: ./gradlew lintKotlin

      - name: Run Android lint
        run: ./gradlew lint

      - name: Build Keywi debug APK
        run: ./gradlew assembleDebug

      - name: Stage latest APK on main
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/Keywi-latest.apk

      - name: Upload Keywi debug APK
        uses: actions/upload-artifact@v6
        with:
          name: keywi-debug
          path: apk/Keywi-latest.apk
          retention-days: 14

      - name: Publish latest APK to main
        run: |
          if git diff --quiet -- apk/Keywi-latest.apk; then
            echo "APK is unchanged; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Keywi-latest.apk
          git commit -m "Update Keywi latest APK [skip ci]"
          git push